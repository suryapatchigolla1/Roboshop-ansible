- name: Disable default nginx module
  ansible.builtin.dnf: 
    name: '@nginx'

- name: Enable nginx 1.24 module
  ansible.builtin.dnf: 
    name: nginx
    state: present
    moudule_enabled: 
      - nginx:1.24

- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Start nginx service
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true


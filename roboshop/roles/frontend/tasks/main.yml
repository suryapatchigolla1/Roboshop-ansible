- name: Disable default "{{ packageName }}" module
  ansible.builtin.shell: dnf module disable "{{ packageName }}" -y
  
- name: enable default "{{ packageName }}" module
  ansible.builtin.shell: dnf module enable "{{ packageName }}":1.24 -y

- name: Install "{{ packageName }}"
  ansible.builtin.package:
    name: "{{ packageName }}"
    state: present

- name: Cleanup the default "{{ packageName }}" content
  ansible.builtin.file:
    path: /usr/share/"{{ packageName }}" /html
    state: absent       

- name: Preparing "{{ packageName }}" Directory
  ansible.builtin.file:
    path: /usr/share/"{{ packageName }}" /html
    state: directory

- name: Download the frontend content
  ansible.builtin.unarchive:
    src: "{{ url }}"
    dest: /usr/share/"{{ packageName }}" /html
    remote_src: yes    

- name: Start "{{ packageName }}" service
  ansible.builtin.service:
    name: "{{ packageName }}"
    enabled: true
    state: restarted

- name: configuring the hostname
  ansible.builtin.shell: hostnamectl set-hostname frontend-{{ env }}

